[package]
name = "notifytrap"
version = "1.4.0"
default-run = "notifytrap"
description = "Local-first desktop utility for capturing, inspecting, and debugging application notifications."
authors = ["NotifyTrap Contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "notifytrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "notifytrap"
path = "src/main.rs"

[[bin]]
name = "notifytrap-cli"
path = "src/bin/notifytrap_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
axum = "0.8"
rusqlite = { version = "0.42", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
aes-gcm = "0.10"
base64 = "0.23"
rand = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mail-parser = "1"
ammonia = "4"
regex = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
